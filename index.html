<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEON AURA AR | Vaibhav Solanke</title>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
        crossorigin="anonymous"></script>

    <style>

        :root {
            --accent: #00ffcc;
            --bg: #030308;
            --glass: rgba(10, 15, 25, 0.55);
            --border: rgba(255,255,255,0.14);
            --text: #ffffff;
            --muted: rgba(255,255,255,0.65);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        /* =========================
           CAMERA
        ========================== */

        .video-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .input_video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            filter:
                brightness(0.62)
                contrast(1.08)
                saturate(0.9);

            z-index: 0;
        }

        #bgCanvas,
        #mainCanvas {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            transform: scaleX(-1);

            pointer-events: none;
        }

        #bgCanvas {
            z-index: 1;
        }

        #mainCanvas {
            z-index: 5;
        }

        /* =========================
           TOP BRAND
        ========================== */

        .brand {
            position: absolute;

            top: 20px;
            right: 25px;

            z-index: 20;

            padding: 10px 15px;

            border: 1px solid var(--border);
            border-radius: 14px;

            background: rgba(5, 8, 15, 0.45);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            text-align: right;

            pointer-events: none;
        }

        .brand-title {
            font-size: 12px;
            font-weight: 700;

            letter-spacing: 2px;

            color: var(--accent);

            text-shadow:
                0 0 10px var(--accent);
        }

        .brand-author {
            margin-top: 4px;

            font-size: 10px;

            color: rgba(255,255,255,0.65);

            letter-spacing: 1px;
        }

        /* =========================
           HUD
        ========================== */

        #hud {
            position: absolute;

            top: 20px;
            left: 20px;

            z-index: 20;

            width: 220px;

            display: flex;
            flex-direction: column;

            gap: 12px;

            transition: 0.4s ease;
        }

        .panel {
            padding: 15px 18px;

            border-radius: 15px;

            background: var(--glass);

            border: 1px solid var(--border);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 15px 45px rgba(0,0,0,0.4);
        }

        .panel-title {
            margin-bottom: 10px;

            font-size: 10px;

            letter-spacing: 2px;

            color: rgba(255,255,255,0.45);

            text-transform: uppercase;
        }

        .stat {
            display: flex;

            justify-content: space-between;

            margin: 7px 0;

            font-size: 13px;

            color: rgba(255,255,255,0.75);
        }

        .stat span {
            color: var(--accent);

            font-weight: 700;

            text-shadow:
                0 0 8px var(--accent);
        }

        /* =========================
           STATUS
        ========================== */

        .status {
            position: absolute;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 30;

            padding: 8px 15px;

            border-radius: 20px;

            background: rgba(0,0,0,0.45);

            border: 1px solid var(--border);

            backdrop-filter: blur(15px);

            font-size: 11px;

            letter-spacing: 1px;

            color: rgba(255,255,255,0.75);

            transition: 0.3s ease;

            pointer-events: none;
        }

        .status.ready {
            color: #00ffcc;

            border-color: rgba(0,255,204,0.35);

            box-shadow:
                0 0 20px rgba(0,255,204,0.12);
        }

        /* =========================
           THEMES
        ========================== */

        #themes {
            position: absolute;

            bottom: 22px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 30;

            display: flex;

            gap: 5px;

            padding: 7px;

            border-radius: 30px;

            background: rgba(5,8,15,0.65);

            border: 1px solid var(--border);

            backdrop-filter: blur(18px);

            box-shadow:
                0 10px 40px rgba(0,0,0,0.45);
        }

        .theme-btn {
            border: none;

            background: transparent;

            color: rgba(255,255,255,0.85);

            padding: 9px 15px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 12px;

            font-weight: 600;

            transition: 0.25s ease;
        }

        .theme-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .theme-btn.active {
            background: rgba(255,255,255,0.16);

            box-shadow:
                0 0 15px rgba(255,255,255,0.08);

            color: white;
        }

        /* =========================
           START / LOADING SCREEN
        ========================== */

        #startOverlay {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(20,25,50,0.75),
                    rgba(0,0,0,0.97)
                );

            backdrop-filter: blur(14px);

            transition:
                opacity 0.6s ease,
                visibility 0.6s ease;
        }

        #startOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .logo-ring {
            width: 95px;
            height: 95px;

            margin-bottom: 30px;

            border-radius: 50%;

            border:
                2px solid rgba(0,255,204,0.5);

            box-shadow:
                0 0 20px rgba(0,255,204,0.25),
                inset 0 0 20px rgba(0,255,204,0.1);

            animation:
                ringPulse 2s infinite ease-in-out;
        }

        @keyframes ringPulse {

            0% {
                transform: scale(0.9) rotate(0deg);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.05) rotate(180deg);
                opacity: 1;
            }

            100% {
                transform: scale(0.9) rotate(360deg);
                opacity: 0.6;
            }
        }

        .main-title {
            font-size: clamp(32px, 6vw, 65px);

            font-weight: 300;

            letter-spacing: 8px;

            margin-bottom: 12px;

            text-shadow:
                0 0 15px rgba(255,255,255,0.3),
                0 0 35px rgba(0,255,204,0.15);
        }

        .subtitle {
            max-width: 600px;

            margin-bottom: 12px;

            color: rgba(255,255,255,0.65);

            font-size: 14px;

            letter-spacing: 1px;
        }

        .creator {
            margin-bottom: 35px;

            color: var(--accent);

            font-size: 13px;

            letter-spacing: 2px;

            text-shadow:
                0 0 12px var(--accent);
        }

        .start-btn {
            padding: 15px 35px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 30px;

            background:
                linear-gradient(
                    45deg,
                    #ff00cc,
                    #3333ff
                );

            color: white;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 0 30px rgba(255,0,204,0.25);

            transition: 0.25s ease;
        }

        .start-btn:hover {
            transform: translateY(-2px) scale(1.04);

            box-shadow:
                0 0 45px rgba(255,0,204,0.45);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* =========================
           LOADING
        ========================== */

        #loadingPanel {
            display: none;

            flex-direction: column;

            align-items: center;
        }

        #loadingPanel.show {
            display: flex;
        }

        .loading-text {
            margin-top: 18px;

            color: rgba(255,255,255,0.7);

            font-size: 13px;

            letter-spacing: 1px;
        }

        .loader {
            width: 180px;
            height: 3px;

            margin-top: 15px;

            overflow: hidden;

            border-radius: 10px;

            background: rgba(255,255,255,0.1);
        }

        .loader-bar {
            width: 40%;
            height: 100%;

            border-radius: 10px;

            background: var(--accent);

            box-shadow:
                0 0 15px var(--accent);

            animation:
                loadingMove 1.1s infinite ease-in-out;
        }

        @keyframes loadingMove {

            0% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(350%);
            }
        }

        /* =========================
           READY SCREEN
        ========================== */

        #readyMessage {
            display: none;

            flex-direction: column;

            align-items: center;
        }

        #readyMessage.show {
            display: flex;
        }

        .ready-icon {
            color: var(--accent);

            font-size: 22px;

            margin-bottom: 10px;

            text-shadow:
                0 0 15px var(--accent);
        }

        .ready-title {
            font-size: 15px;

            font-weight: 700;

            letter-spacing: 2px;
        }

        .ready-subtitle {
            margin-top: 7px;

            color: rgba(255,255,255,0.55);

            font-size: 12px;
        }

        /* =========================
           HIDDEN
        ========================== */

        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 700px) {

            #hud {
                top: 12px;
                left: 12px;

                width: 180px;
            }

            .panel {
                padding: 11px 13px;
            }

            .stat {
                font-size: 11px;
            }

            .brand {
                top: 12px;
                right: 12px;
            }

            #themes {
                bottom: 12px;

                max-width: 95vw;

                overflow-x: auto;
            }

            .theme-btn {
                padding: 8px 10px;

                font-size: 10px;
            }

            .main-title {
                letter-spacing: 4px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         CAMERA + CANVAS
    ========================== -->

    <div class="video-container">

        <video
            class="input_video"
            autoplay
            playsinline>
        </video>

        <canvas id="bgCanvas"></canvas>

        <canvas id="mainCanvas"></canvas>

    </div>


    <!-- =========================
         BRANDING
    ========================== -->

    <div class="brand">

        <div class="brand-title">
            NEON AURA AR
        </div>

        <div class="brand-author">
            BY VAIBHAV SOLANKE
        </div>

    </div>


    <!-- =========================
         STATUS
    ========================== -->

    <div id="status" class="status">
        SYSTEM OFFLINE
    </div>


    <!-- =========================
         HUD
    ========================== -->

    <div id="hud" class="ui-hidden">

        <div class="panel">

            <div class="panel-title">
                Tracking
            </div>

            <div class="stat">
                Hands
                <span id="ui-hands">0</span>
            </div>

            <div class="stat">
                FPS
                <span id="ui-fps">0</span>
            </div>

        </div>


        <div class="panel">

            <div class="panel-title">
                Gesture
            </div>

            <div class="stat">
                Action
                <span id="ui-gesture">None</span>
            </div>

            <div class="stat">
                Spread
                <span id="ui-spread">0%</span>
            </div>

        </div>

    </div>


    <!-- =========================
         THEMES
    ========================== -->

    <div id="themes" class="ui-hidden">

        <button
            class="theme-btn active"
            data-theme="Rainbow">
            Rainbow
        </button>

        <button
            class="theme-btn"
            data-theme="Cyberpunk">
            Cyberpunk
        </button>

        <button
            class="theme-btn"
            data-theme="Lava">
            Lava
        </button>

        <button
            class="theme-btn"
            data-theme="Ocean">
            Ocean
        </button>

        <button
            class="theme-btn"
            data-theme="Galaxy">
            Galaxy
        </button>

    </div>


    <!-- =========================
         START SCREEN
    ========================== -->

    <div id="startOverlay">

        <div class="logo-ring"></div>

        <h1 class="main-title">
            NEON AURA AR
        </h1>

        <p class="subtitle">
            An Interactive Real-Time Hand Tracking AR Experience
        </p>

        <p class="creator">
            CREATED BY VAIBHAV SOLANKE
        </p>


        <button
            class="start-btn"
            id="startBtn">

            ENTER EXPERIENCE

        </button>


        <!-- Loading -->

        <div id="loadingPanel">

            <div class="loading-text">
                Initializing Hand Tracking...
            </div>

            <div class="loader">
                <div class="loader-bar"></div>
            </div>

        </div>


        <!-- Ready -->

        <div id="readyMessage">

            <div class="ready-icon">
                ✓
            </div>

            <div class="ready-title">
                SYSTEM READY
            </div>

            <div class="ready-subtitle">
                Show your hands to the camera
            </div>

        </div>

    </div>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

const videoElement =
    document.querySelector('.input_video');

const bgCanvas =
    document.getElementById('bgCanvas');

const mainCanvas =
    document.getElementById('mainCanvas');

const bgCtx =
    bgCanvas.getContext('2d');

const ctx =
    mainCanvas.getContext('2d');


let width =
    window.innerWidth;

let height =
    window.innerHeight;


let time = 0;

let lastTime =
    performance.now();

let framesThisSecond = 0;

let lastFpsTime =
    performance.now();


let currentHands = [];

let handVelocities = 0;


/* =====================================================
   UI
===================================================== */

const uiHands =
    document.getElementById('ui-hands');

const uiFps =
    document.getElementById('ui-fps');

const uiGesture =
    document.getElementById('ui-gesture');

const uiSpread =
    document.getElementById('ui-spread');

const hud =
    document.getElementById('hud');

const themesElement =
    document.getElementById('themes');

const statusElement =
    document.getElementById('status');

const startOverlay =
    document.getElementById('startOverlay');

const startBtn =
    document.getElementById('startBtn');

const loadingPanel =
    document.getElementById('loadingPanel');

const readyMessage =
    document.getElementById('readyMessage');


/* =====================================================
   THEMES
===================================================== */

let currentTheme = 'Rainbow';


const themes = {

    Rainbow:
        (t, index, total) =>
            `hsl(${(t * 100 +
                index * (360 / total)) % 360},
                100%, 60%)`,

    Cyberpunk:
        (t, index, total) =>
            index % 2 === 0
                ? '#ff003c'
                : '#00f0ff',

    Lava:
        (t, index, total) =>
            `hsl(${(10 +
                index * 10) % 40},
                100%,
                ${50 + Math.sin(t) * 10}%)`,

    Ocean:
        (t, index, total) =>
            `hsl(${180 +
                index * 20},
                100%, 60%)`,

    Galaxy:
        (t, index, total) =>
            `hsl(${260 +
                Math.sin(t * 2 + index) * 40},
                100%, 65%)`
};


/* =====================================================
   PARTICLES
===================================================== */

let particles = [];

let ripples = [];


/* Thumb + Index + Middle + Ring + Pinky */

const FINGER_TIPS =
    [4, 8, 12, 16, 20];


/* =====================================================
   MATRIX BACKGROUND
===================================================== */

let matrixColumns = [];

const fontSize = 16;

let maxColumns = 0;


/* =====================================================
   AUDIO
===================================================== */

let audioCtx = null;

let humOsc = null;

let humGain = null;


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    bgCanvas.width =
        width;

    bgCanvas.height =
        height;


    mainCanvas.width =
        width;

    mainCanvas.height =
        height;


    maxColumns =
        Math.floor(width / fontSize);


    matrixColumns =
        new Array(maxColumns)
            .fill(1)
            .map(() =>
                Math.random() *
                height / fontSize
            );
}


window.addEventListener(
    'resize',
    resize
);

resize();


/* =====================================================
   THEME SWITCHER
===================================================== */

document
    .querySelectorAll('.theme-btn')
    .forEach(btn => {

        btn.addEventListener(
            'click',
            e => {

                document
                    .querySelectorAll('.theme-btn')
                    .forEach(b =>
                        b.classList.remove('active')
                    );


                e.target.classList.add('active');


                currentTheme =
                    e.target.getAttribute(
                        'data-theme'
                    );


                document.documentElement
                    .style.setProperty(
                        '--accent',
                        themes[currentTheme](
                            0,
                            1,
                            1
                        )
                    );

            }
        );

    });


/* =====================================================
   AUDIO ENGINE
===================================================== */

function initAudio() {

    try {

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        humOsc =
            audioCtx.createOscillator();

        humGain =
            audioCtx.createGain();


        humOsc.type =
            'sine';


        humOsc.frequency.value =
            100;


        humGain.gain.value =
            0;


        humOsc.connect(
            humGain
        );

        humGain.connect(
            audioCtx.destination
        );


        humOsc.start();


    } catch (error) {

        console.error(
            'Audio initialization failed:',
            error
        );

    }

}


/* =====================================================
   ZAP SOUND
===================================================== */

function triggerZap() {

    if (!audioCtx)
        return;


    const osc =
        audioCtx.createOscillator();

    const gainNode =
        audioCtx.createGain();


    osc.type =
        'sawtooth';


    osc.frequency.setValueAtTime(
        800,
        audioCtx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        40,
        audioCtx.currentTime + 0.1
    );


    gainNode.gain.setValueAtTime(
        0.5,
        audioCtx.currentTime
    );


    gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + 0.1
    );


    osc.connect(
        gainNode
    );

    gainNode.connect(
        audioCtx.destination
    );


    osc.start();

    osc.stop(
        audioCtx.currentTime + 0.15
    );

}


/* =====================================================
   HUM SOUND
===================================================== */

function updateHum(activeHands) {

    if (!audioCtx || !humGain)
        return;


    if (activeHands.length < 2) {

        humGain.gain.setTargetAtTime(
            0,
            audioCtx.currentTime,
            0.1
        );

        return;
    }


    const p1 =
        activeHands[0][8];

    const p2 =
        activeHands[1][8];


    const dx =
        p1.x - p2.x;

    const dy =
        p1.y - p2.y;


    const dist =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const targetFreq =
        100 +
        (1 - Math.min(dist, 1)) *
        300;


    const targetVolume =
        0.04 +
        (1 - Math.min(dist, 1)) *
        0.12;


    humOsc.frequency.setTargetAtTime(
        targetFreq,
        audioCtx.currentTime,
        0.1
    );


    humGain.gain.setTargetAtTime(
        targetVolume,
        audioCtx.currentTime,
        0.1
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function getDist(p1, p2) {

    return Math.hypot(
        p1.x - p2.x,
        p1.y - p2.y
    );

}


/* =====================================================
   MAP LANDMARK TO CANVAS
===================================================== */

function mapToCanvas(point) {

    return {

        x: point.x * width,

        y: point.y * height

    };

}


/* =====================================================
   PINCH STATE
===================================================== */

let lastPinchState =
    [false, false];


/* =====================================================
   GESTURE DETECTION
===================================================== */

function detectGestures() {

    if (!currentHands.length)
        return;


    currentHands.forEach(
        (hand, idx) => {

            const thumb =
                hand[4];

            const index =
                hand[8];


            const dist =
                getDist(
                    thumb,
                    index
                );


            const isPinching =
                dist < 0.05;


            if (
                isPinching &&
                !lastPinchState[idx]
            ) {

                const midpoint = {

                    x:
                        (thumb.x +
                         index.x) / 2,

                    y:
                        (thumb.y +
                         index.y) / 2

                };


                createShockwave(

                    mapToCanvas(
                        midpoint
                    ),

                    themes[currentTheme](
                        time,
                        1,
                        1
                    )

                );


                triggerZap();


                uiGesture.innerText =
                    'PINCH';

            }


            lastPinchState[idx] =
                isPinching;

        }
    );


    /* Hand spread */

    if (currentHands[0]) {

        const spread =
            getDist(
                currentHands[0][8],
                currentHands[0][20]
            );


        const spreadPct =
            Math.min(
                Math.round(
                    spread * 300
                ),
                100
            );


        uiSpread.innerText =
            spreadPct + '%';


        if (
            !lastPinchState.includes(true)
        ) {

            uiGesture.innerText =
                spreadPct > 50
                    ? 'OPEN HAND'
                    : 'FIST';

        }

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    pos,
    color,
    count = 3
) {

    for (
        let i = 0;
        i < count;
        i++
    ) {

        particles.push({

            x: pos.x,

            y: pos.y,

            vx:
                (Math.random() - 0.5) *
                8,

            vy:
                (Math.random() - 0.5) *
                8,

            life: 1,

            color: color,

            size:
                Math.random() * 3 + 1

        });

    }

}


/* =====================================================
   SHOCKWAVE
===================================================== */

function createShockwave(
    pos,
    color
) {

    ripples.push({

        x: pos.x,

        y: pos.y,

        radius: 0,

        maxRadius:
            150 +
            Math.random() * 100,

        life: 1,

        color: color

    });

}


/* =====================================================
   MATRIX BACKGROUND
===================================================== */

function drawBackground() {

    bgCtx.globalCompositeOperation =
        'destination-out';


    bgCtx.fillStyle =
        `rgba(
            0,
            0,
            0,
            ${0.15 +
            Math.min(
                handVelocities * 10,
                0.5
            )}
        )`;


    bgCtx.fillRect(
        0,
        0,
        width,
        height
    );


    bgCtx.globalCompositeOperation =
        'source-over';


    bgCtx.fillStyle =
        themes[currentTheme](
            time,
            1,
            1
        );


    bgCtx.font =
        fontSize + 'px monospace';


    const speedMult =
        1 +
        handVelocities * 100;


    for (
        let i = 0;
        i < matrixColumns.length;
        i++
    ) {

        if (
            Math.random() > 0.95
        ) {

            const char =
                String.fromCharCode(
                    0x30A0 +
                    Math.random() * 96
                );


            bgCtx.fillText(
                char,
                i * fontSize,
                matrixColumns[i] *
                fontSize
            );

        }


        matrixColumns[i] +=
            Math.random() *
            speedMult;


        if (
            matrixColumns[i] *
            fontSize >
            height &&
            Math.random() > 0.9
        ) {

            matrixColumns[i] = 0;

        }

    }

}


/* =====================================================
   PHYSICS
===================================================== */

function updatePhysics() {

    /* Particles */

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.life -= 0.02;

        p.vy += 0.1;


        if (p.life <= 0) {

            particles.splice(
                i,
                1
            );

        } else {

            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                p.color;


            ctx.globalAlpha =
                p.life;


            ctx.fill();

        }

    }


    /* Shockwaves */

    for (
        let i = ripples.length - 1;
        i >= 0;
        i--
    ) {

        const r =
            ripples[i];


        r.radius +=
            (r.maxRadius -
             r.radius) *
            0.1;


        r.life -= 0.03;


        if (r.life <= 0) {

            ripples.splice(
                i,
                1
            );

        } else {

            ctx.beginPath();


            ctx.arc(
                r.x,
                r.y,
                r.radius,
                0,
                Math.PI * 2
            );


            ctx.strokeStyle =
                r.color;


            ctx.lineWidth =
                4 * r.life;


            ctx.globalAlpha =
                r.life;


            ctx.stroke();

        }

    }


    ctx.globalAlpha = 1;

}


/* =====================================================
   MAIN RENDER LOOP
===================================================== */

function renderLoop(timestamp) {

    requestAnimationFrame(
        renderLoop
    );


    const dt =
        (timestamp -
         lastTime) / 1000;


    lastTime =
        timestamp;


    time += dt;


    /* FPS */

    framesThisSecond++;


    if (
        timestamp >
        lastFpsTime + 1000
    ) {

        uiFps.innerText =
            framesThisSecond;


        framesThisSecond = 0;

        lastFpsTime =
            timestamp;

    }


    /* Background */

    drawBackground();


    /* Fade canvas */

    ctx.globalCompositeOperation =
        'destination-out';


    ctx.fillStyle =
        'rgba(0,0,0,0.2)';


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Neon blend */

    ctx.globalCompositeOperation =
        'screen';


    updatePhysics();


    /* Hand rendering */

    if (
        currentHands.length > 0
    ) {

        currentHands.forEach(
            (hand, handIndex) => {

                const glowColor =
                    themes[currentTheme](
                        time,
                        handIndex,
                        2
                    );


                /* Skeleton */

                drawConnectors(
                    ctx,
                    hand,
                    HAND_CONNECTIONS,
                    {
                        color: glowColor,
                        lineWidth: 2
                    }
                );


                /* Fingertips */

                ctx.shadowBlur = 15;

                ctx.shadowColor =
                    glowColor;


                FINGER_TIPS.forEach(
                    (tipIndex, idx) => {

                        const pt =
                            mapToCanvas(
                                hand[tipIndex]
                            );


                        const tipColor =
                            themes[currentTheme](
                                time,
                                idx,
                                FINGER_TIPS.length
                            );


                        ctx.beginPath();


                        ctx.arc(
                            pt.x,
                            pt.y,
                            4,
                            0,
                            Math.PI * 2
                        );


                        ctx.fillStyle =
                            '#ffffff';


                        ctx.fill();


                        /* Particles */

                        if (
                            Math.random() >
                            0.6
                        ) {

                            createParticles(
                                pt,
                                tipColor,
                                1
                            );

                        }

                    }
                );


                ctx.shadowBlur = 0;

            }
        );


        /* Two-hand interaction */

        if (
            currentHands.length >= 2
        ) {

            const h1 =
                currentHands[0];

            const h2 =
                currentHands[1];


            /* Lightning */

            FINGER_TIPS.forEach(
                (tipIndex, idx) => {

                    const pt1 =
                        mapToCanvas(
                            h1[tipIndex]
                        );

                    const pt2 =
                        mapToCanvas(
                            h2[tipIndex]
                        );


                    const dist =
                        getDist(
                            pt1,
                            pt2
                        );


                    const color =
                        themes[currentTheme](
                            time,
                            idx,
                            FINGER_TIPS.length
                        );


                    if (
                        dist < 150 &&
                        Math.random() > 0.5
                    ) {

                        ctx.beginPath();

                        ctx.moveTo(
                            pt1.x,
                            pt1.y
                        );


                        const midX =
                            (pt1.x +
                             pt2.x) / 2 +
                            (Math.random() -
                             0.5) * 50;


                        const midY =
                            (pt1.y +
                             pt2.y) / 2 +
                            (Math.random() -
                             0.5) * 50;


                        ctx.lineTo(
                            midX,
                            midY
                        );


                        ctx.lineTo(
                            pt2.x,
                            pt2.y
                        );


                        ctx.strokeStyle =
                            '#ffffff';


                        ctx.shadowBlur =
                            20;


                        ctx.shadowColor =
                            color;


                        ctx.lineWidth = 3;

                        ctx.stroke();

                    }


                    /* Connecting gradient */

                    ctx.beginPath();


                    ctx.moveTo(
                        pt1.x,
                        pt1.y
                    );


                    ctx.lineTo(
                        pt2.x,
                        pt2.y
                    );


                    const gradient =
                        ctx.createLinearGradient(
                            pt1.x,
                            pt1.y,
                            pt2.x,
                            pt2.y
                        );


                    gradient.addColorStop(
                        0,
                        themes[currentTheme](
                            time,
                            idx,
                            5
                        )
                    );


                    gradient.addColorStop(
                        0.5,
                        themes[currentTheme](
                            time,
                            idx + 1,
                            5
                        )
                    );


                    gradient.addColorStop(
                        1,
                        themes[currentTheme](
                            time,
                            idx + 2,
                            5
                        )
                    );


                    ctx.strokeStyle =
                        gradient;


                    ctx.lineWidth = 4;

                    ctx.shadowBlur = 10;

                    ctx.shadowColor =
                        color;


                    ctx.stroke();

                    ctx.shadowBlur = 0;

                }
            );


            /* Mandala */

            const allTips =
                FINGER_TIPS
                    .map(t =>
                        mapToCanvas(
                            h1[t]
                        )
                    )
                    .concat(
                        FINGER_TIPS
                            .map(t =>
                                mapToCanvas(
                                    h2[t]
                                )
                            )
                    );


            ctx.save();


            const cx =
                allTips.reduce(
                    (sum, p) =>
                        sum + p.x,
                    0
                ) / 10;


            const cy =
                allTips.reduce(
                    (sum, p) =>
                        sum + p.y,
                    0
                ) / 10;


            ctx.translate(
                cx,
                cy
            );


            ctx.rotate(
                time * 0.5
            );


            ctx.beginPath();


            for (
                let i = 0;
                i < 10;
                i++
            ) {

                const t1 = {

                    x:
                        allTips[i].x -
                        cx,

                    y:
                        allTips[i].y -
                        cy

                };


                const t2 = {

                    x:
                        allTips[
                            (i + 3) % 10
                        ].x - cx,

                    y:
                        allTips[
                            (i + 3) % 10
                        ].y - cy

                };


                ctx.moveTo(
                    t1.x,
                    t1.y
                );


                ctx.lineTo(
                    t2.x,
                    t2.y
                );

            }


            ctx.strokeStyle =
                'rgba(255,255,255,0.2)';


            ctx.lineWidth = 1;

            ctx.stroke();

            ctx.restore();

        }


        detectGestures();

    }


    ctx.globalCompositeOperation =
        'source-over';

}


/* =====================================================
   MEDIAPIPE
===================================================== */

let mediaPipeReady = false;

let firstDetectionReceived = false;


function initMediaPipe() {

    const hands =
        new Hands({

            locateFile: file => {

                return `
                    https://cdn.jsdelivr.net/npm/
                    @mediapipe/hands/${file}
                `.replace(/\s+/g, '');

            }

        });


    hands.setOptions({

        /* Faster model */

        maxNumHands: 2,

        modelComplexity: 0,

        minDetectionConfidence: 0.65,

        minTrackingConfidence: 0.65

    });


    hands.onResults(
        results => {

            if (!audioCtx)
                return;


            const detected =
                results.multiHandLandmarks
                    ? results.multiHandLandmarks.length
                    : 0;


            uiHands.innerText =
                detected;


            /* First result */

            if (
                !firstDetectionReceived
            ) {

                firstDetectionReceived =
                    true;

                mediaPipeReady =
                    true;


                statusElement.innerText =
                    '● SYSTEM READY';

                statusElement.classList.add(
                    'ready'
                );


                loadingPanel.classList.remove(
                    'show'
                );


                readyMessage.classList.add(
                    'show'
                );


                /* Show main UI */

                setTimeout(() => {

                    startOverlay.classList.add(
                        'hidden'
                    );

                    hud.classList.remove(
                        'ui-hidden'
                    );

                    themesElement.classList.remove(
                        'ui-hidden'
                    );

                }, 700);

            }


            /* Hand velocity */

            if (
                currentHands.length > 0 &&
                results.multiHandLandmarks &&
                results.multiHandLandmarks.length > 0
            ) {

                const oldPoint =
                    currentHands[0][8];

                const newPoint =
                    results.multiHandLandmarks[0][8];


                if (
                    oldPoint &&
                    newPoint
                ) {

                    handVelocities =
                        getDist(
                            oldPoint,
                            newPoint
                        );

                }

            } else {

                handVelocities = 0;

            }


            currentHands =
                results.multiHandLandmarks ||
                [];


            updateHum(
                currentHands
            );

        }
    );


    /* Camera */

    const camera =
        new Camera(
            videoElement,
            {

                onFrame:
                    async () => {

                        await hands.send({
                            image:
                                videoElement
                        });

                    },

                width: 1280,

                height: 720,

                facingMode: 'user'

            }
        );


    camera.start();

}


/* =====================================================
   START EXPERIENCE
===================================================== */

startBtn.addEventListener(
    'click',
    async () => {

        /* Prevent double click */

        startBtn.disabled = true;

        startBtn.style.display =
            'none';


        loadingPanel.classList.add(
            'show'
        );


        statusElement.innerText =
            'INITIALIZING SYSTEM...';


        /* Start audio */

        initAudio();


        /* Start render */

        requestAnimationFrame(
            renderLoop
        );


        /* Start MediaPipe */

        initMediaPipe();

    }
);


/* =====================================================
   INITIAL STATUS
===================================================== */

statusElement.innerText =
    'SYSTEM OFFLINE';
